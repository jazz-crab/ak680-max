# AK680 MAX — целевое состояние устройства.
#
# Это источник истины: `ak680 apply --yes` приводит клавиатуру к этому файлу.
# Меняй намерение (что делает клавиша, глубина срабатывания, цвета), а не
# сырые байты протокола. Подробный регламент — PROVISIONING.md.

[device]
vid = 0x3151
pid = 0x502D
# Прошивка, под которую проверен протокол. После обновления прошивки —
# сначала `ak680 status`, `ak680 backup`, затем сверь precision.
firmware = "v306"
# "active" — писать в текущий профиль; либо номер 0..3.
profile = "active"

[layout]
# Позиция электрической матрицы -> HID usage.
[layout.base_remaps]
1 = 0x35    # физический Esc/угол -> ` (в русской раскладке — ё)
3 = 0x29    # Caps -> Esc (CapsLock не нужен)
85 = 0x4C   # правый столбец -> Delete
86 = 0x4A   # -> Home
87 = 0x46   # -> PrintScreen
88 = 0x4D   # -> End

[layout.fn_remaps]
32 = 0x35   # Fn + физический T -> ` (запасной способ напечатать ё)

[switches]
actuation_mm = 1.0
release_mm = 1.5
# v306: 0.01 мм на единицу (raw = мм * precision).
precision = 100

[lighting]
enabled = true
# Прошивка после холодного старта может сама переключиться на слот 1, поэтому
# держим рисунок именно там: иначе клавиши остаются тёмными, хотя режим LED
# всё ещё UserPicture.
slot = 1
mode = 13          # UserPicture
speed = 4
brightness = 4
flash_rgb = [0, 200, 200]

# Цвета, которые уходят в прошивку. Это сочные варианты, а не пастельный
# TokyoNight: пастель на подсветке вымывается (см. README).
[lighting.palette]
blue = "#7AA2F7"
orange = "#FF4C00"
red = "#FF0012"
purple = "#CC33E8"

# Палитра только для PNG-превью: как цвет должен выглядеть, а не какие
# байты уходят в железо.
[lighting.preview_palette]
blue = "#7AA2F7"
orange = "#FF9E64"
red = "#F7768E"
purple = "#BB9AF7"

# Яркость зоны на железе (1.0 = максимум). Оранжевый на полной яркости
# вымывается в беж, красный — чуть приглушён.
[lighting.levels]
orange = 0.58
red = 0.88

# Компенсация каналов: воспринимаемая яркость канала на единицу байта.
# Измерено на этой плате; при смене устройства — перекалибровать.
[lighting.channel_gain]
red = 0.384
green = 1.0
blue = 0.469
